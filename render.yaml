databases:
  - name: aura-n8n-db
    databaseName: n8n
    user: n8n
    plan: free
    region: oregon

services:
  - type: web
    name: aura-clinic-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @clinic/shared && npm run build -w @clinic/api
    startCommand: npm run start -w @clinic/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin@auraclinic.com
      - key: ADMIN_PASSWORD
        value: AuraClinicAdmin2026!
      - key: GOOGLE_SHEETS_DOCUMENT_NAME
        value: "Clinic Booking Database"
      - key: GOOGLE_CALENDAR_NAME
        value: "Clinic Appointments"
      - key: PATIENT_APP_ORIGIN
        value: https://aura-clinic-patient.vercel.app
      - key: ADMIN_APP_ORIGIN
        value: https://aura-clinic-admin-one.vercel.app
      - key: N8N_BOOKING_WEBHOOK_URL
        value: https://father-samples-leon-associates.trycloudflare.com/webhook/clinic-booking
      - key: N8N_CANCELLATION_WEBHOOK_URL
        value: https://father-samples-leon-associates.trycloudflare.com/webhook/clinic-cancel
      - key: N8N_RESCHEDULE_WEBHOOK_URL
        value: https://father-samples-leon-associates.trycloudflare.com/webhook/clinic-reschedule

  - type: web
    name: aura-clinic-n8n
    env: docker
    dockerfilePath: ./Dockerfile.n8n
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: aura-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: aura-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: aura-n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: aura-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: aura-n8n-db
          property: password
